              type: array
              items:
                type: object
                properties:
                  t: {type: string, format: date-time, description: Start of the bucket}
                  region: {type: string}
                  checks: {type: integer}
                  failures: {type: integer}
                  avg_ms: {type: [number, 'null'], description: Mean response time of passing checks}
                  max_ms: {type: [number, 'null']}
    MonitorDailyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            days: {type: integer}
            items:
              type: array
              items:
                type: object
                properties:
                  day: {type: string, format: date}
                  checks: {type: integer}
                  failures: {type: integer}
                  uptime: {type: [number, 'null'], description: Percentage of checks that passed}
                  avg_ms: {type: [number, 'null']}
    RegionListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            regions:
              type: array
              items: {type: string}
            default: {type: string}
            online:
              type: array
              items: {type: string}
    AlertChannel:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [email, telegram, slack, webhook]}
        name: {type: string, maxLength: 128}
        config:
          type: object
          description: The kind's settings, without secrets.
          properties:
            emails:
              type: array
              items: {type: string, format: email}
            chat_id: {type: string}
            topic_id: {type: integer, format: int64}
            webhook_url: {type: string, description: The Slack webhook with all but its last four characters hidden}
            url: {type: string, format: uri}
            signing_secret_set: {type: boolean}
        enabled: {type: boolean}
        all_monitors: {type: boolean}
        monitor_ids:
          type: array
          items: {type: string, format: uuid}
        last_delivered_at: {type: [string, 'null'], format: date-time}
        last_error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    AlertChannelInput:
      type: object
      additionalProperties: false
      properties:
        kind: {type: string, enum: [email, telegram, slack, webhook], description: Required on create; cannot change}
        name: {type: string, minLength: 1, maxLength: 128, description: Required on create}
        emails:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, format: email, maxLength: 254}
          description: Bare addresses, no display names. Duplicates are dropped.
        chat_id: {type: string, description: 'A numeric Telegram chat id, or an @channel username. Telegram is available only when the server has a bot configured.'}
        topic_id: {type: integer, format: int64, minimum: 0, description: A forum topic in the chat; 0 for none}
        webhook_url: {type: string, description: 'A Slack incoming webhook, https://hooks.slack.com/services/...'}
        url: {type: string, format: uri, maxLength: 2048, description: 'An https:// endpoint to POST signed JSON to'}
        enabled: {type: boolean, default: true}
        all_monitors: {type: boolean, default: true}
        monitor_ids:
          type: array
          items: {type: string, format: uuid}
          description: The monitors this channel covers when all_monitors is false
