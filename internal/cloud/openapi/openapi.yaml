            account:
              type: object
              properties:
                id: {type: string, format: uuid}
                email: {type: string, format: email}
                plan: {type: string, enum: [free, starter, pro, business]}
                status: {type: string, enum: [active, suspended, closed]}
                role: {type: string, enum: [owner, admin, member]}
                name: {type: string, maxLength: 128, description: Workspace name, empty when unset}
                display_name: {type: string, maxLength: 128, description: The person's name, empty when unset}
                timezone: {type: string, maxLength: 64, description: IANA time zone the dashboard renders timestamps in, empty to follow the browser}
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are left alone; an empty string clears the value.
      properties:
        display_name: {type: string, maxLength: 128}
        timezone: {type: string, maxLength: 64, description: An IANA time zone name such as Africa/Nairobi}
    WorkspacePatch:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, maxLength: 128, description: An empty string clears the name}
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    EmailChangeVerify:
      type: object
      additionalProperties: false
      required: [challenge_id, email, code]
      properties:
        challenge_id: {type: string, format: uuid}
        email: {type: string, format: email, maxLength: 254}
        code: {type: string, minLength: 6, maxLength: 6}
    ChallengeResponse:
      type: object
      properties:
        challenge_id: {type: string, format: uuid}
        expires_in: {type: integer, description: Seconds until the code expires}
    Monitor:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 128}
        kind: {type: string, enum: [http, keyword, tcp, heartbeat]}
        target: {type: [string, 'null'], description: 'The checked URL, or tcp://host:port. Null for heartbeats.'}
        grace_seconds: {type: integer, description: Heartbeats only; extra time allowed after interval_seconds before the monitor goes down}
        method: {type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]}
        headers:
          type: object
          additionalProperties: {type: string}
          description: Request headers with canonical names. Credential-like values read `********`.
        body: {type: [string, 'null']}
        expected_statuses:
          type: array
          items: {type: integer}
          description: Accepted status codes. Empty accepts 200 to 399.
        keyword: {type: [string, 'null']}
        keyword_absent: {type: boolean}
        follow_redirects: {type: boolean}
        interval_seconds: {type: integer}
        timeout_ms: {type: integer}
        regions:
          type: array
          items: {type: string}
          description: Probe regions; empty for heartbeats
        cert_warn_days: {type: integer, description: Days before TLS expiry to send a certificate alert; 0 turns it off}
        state: {type: string, enum: [pending, up, down, paused]}
        state_changed_at: {type: string, format: date-time}
        last_checked_at: {type: [string, 'null'], format: date-time}
        last_status_code: {type: [integer, 'null']}
        last_response_ms: {type: [number, 'null']}
        last_error: {type: [string, 'null']}
        cert_expires_at: {type: [string, 'null'], format: date-time}
        paused: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        uptime:
          type: object
          description: Percentage of checks that passed. Present on list and get only; a window with no checks is left out.
          properties:
            1d: {type: number}
            7d: {type: number}
            30d: {type: number}
        ping_url: {type: string, format: uri, description: Heartbeats only; the URL your job calls}
    MonitorInput:
      type: object
      additionalProperties: false
      description: |
        Fields a heartbeat does not use are ignored for heartbeats. Every field is optional on
        PATCH; on create, kind and name are required, and target too except for heartbeats.
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        kind: {type: string, enum: [http, keyword, tcp, heartbeat], description: Required on create; cannot change}
        target:
          type: string
          maxLength: 2048
          description: An http:// or https:// URL for http and keyword monitors, or host:port for tcp. Must be empty or absent for heartbeats.
        grace_seconds: {type: integer, minimum: 0, maximum: 86400, default: 0}
        method: {type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS], default: GET}
        headers:
          type: object
          maxProperties: 20
          additionalProperties: {type: string, maxLength: 1024}
          description: Header names of letters, digits and dashes, up to 128 characters. Values may not contain line breaks. Stored encrypted.
        body: {type: string, maxLength: 16384, description: Request body, stored encrypted. An empty string removes it.}
        expected_statuses:
          type: array
          maxItems: 20
          items: {type: integer, minimum: 100, maximum: 599}
        keyword: {type: string, minLength: 1, maxLength: 256, description: Required for keyword monitors}
        keyword_absent: {type: boolean, default: false, description: Pass when the keyword is missing instead of present}
        follow_redirects: {type: boolean, default: true}
        interval_seconds:
          type: integer
          maximum: 86400
          description: Seconds between checks, at least the plan's min_interval_seconds (a shorter one returns 429 plan_limit_exceeded). For a heartbeat, how often the job pings, 60 to 86400.
        timeout_ms: {type: integer, minimum: 1000, maximum: 60000, default: 10000, description: Must be shorter than the interval}
        regions:
          type: array
          items: {type: string}
          description: Regions from GET /regions, no more than the plan's regions limit. Defaults to the default region.
        cert_warn_days: {type: integer, minimum: 0, maximum: 365, default: 14}
        paused: {type: boolean, default: false}
    MonitorResponse:
      type: object
      properties:
        data: {$ref: '#/components/schemas/Monitor'}
    MonitorListResponse:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Monitor'}
    MonitorResultListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              region: {type: string}
              checked_at: {type: string, format: date-time}
              up: {type: boolean}
              status_code: {type: [integer, 'null']}
              total_ms: {type: [number, 'null']}
              dns_ms: {type: [number, 'null']}
              connect_ms: {type: [number, 'null']}
              tls_ms: {type: [number, 'null']}
              ttfb_ms: {type: [number, 'null']}
              error: {type: [string, 'null']}
              cert_expires_at: {type: [string, 'null'], format: date-time}
    MonitorSeriesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            range: {type: string, enum: ['1h', '24h', '7d', '30d']}
            bucket_seconds: {type: integer}
