              regions: {type: integer}
              status_pages: {type: integer}
              custom_domains: {type: integer}
              alert_channels: {type: integer}
              retention_days: {type: integer}
              api_keys: {type: integer}
              monthly_api_requests: {type: integer, format: int64}
              team_members: {type: integer}
    DashboardMeResponse:
