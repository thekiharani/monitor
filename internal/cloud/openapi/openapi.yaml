        logo_url: {type: string, maxLength: 2048, description: 'An https:// URL, or empty to clear'}
        theme: {type: string, enum: [auto, light, dark]}
        show_response_times: {type: boolean, description: Show each component's average response time over the last 24 hours}
        published: {type: boolean}
        custom_domain:
          type: string
          maxLength: 253
