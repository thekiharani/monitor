        id: {type: string, format: uuid}
        kind: {type: string, enum: [incident, maintenance]}
        title: {type: string}
        impact: {type: string, enum: [none, minor, major, critical]}
        status: {type: string, enum: [investigating, identified, monitoring, resolved, scheduled, in_progress, completed]}
        starts_at: {type: string, format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updates:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              status: {type: string}
              body: {type: string}
              created_at: {type: string, format: date-time}
    StatusPostInput:
      type: object
      additionalProperties: false
      required: [kind, title, body]
      properties:
        kind: {type: string, enum: [incident, maintenance]}
        title: {type: string, minLength: 1, maxLength: 256}
        impact: {type: string, enum: [none, minor, major, critical], default: minor}
        status:
          type: string
          enum: [investigating, identified, monitoring, resolved, scheduled, in_progress, completed]
          description: An incident takes investigating, identified, monitoring or resolved, defaulting to investigating. Maintenance takes scheduled, in_progress or completed, defaulting to scheduled.
        body: {type: string, minLength: 1, maxLength: 5000}
        starts_at: {type: string, format: date-time, description: Required for maintenance; defaults to now for an incident}
        ends_at: {type: string, format: date-time, description: Required for maintenance and after starts_at}
    StatusPostUpdateInput:
      type: object
      additionalProperties: false
      required: [status, body]
      properties:
        status: {type: string, enum: [investigating, identified, monitoring, resolved, scheduled, in_progress, completed], description: Must be one of the post kind's statuses}
        body: {type: string, minLength: 1, maxLength: 5000}
    StatusPostListResponse:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/StatusPost'}
    StatusPostUpdateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: {type: string, format: uuid, description: The post's id}
            status: {type: string}
    PublicStatus:
      type: object
      properties:
        page:
          type: object
          properties:
            title: {type: string}
            url: {type: string, format: uri}
        status:
          type: object
          properties:
            indicator: {type: string, enum: [none, minor, major, maintenance]}
            description: {type: string, enum: [All systems operational, Partial outage, Major outage, Under maintenance]}
        components:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid, description: The monitor's id}
              name: {type: string}
              group: {type: [string, 'null']}
              status: {type: string, enum: [up, down, maintenance, unknown]}
              uptime_90d: {type: number, description: Percentage of the last 90 days the monitor was not in an incident}
        notices:
          type: array
          description: Open incidents and current or upcoming maintenance
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              kind: {type: string, enum: [incident, maintenance]}
              title: {type: string}
              status: {type: string, enum: [investigating, identified, monitoring, resolved, scheduled, in_progress, completed], description: The post status, as the API stores it}
              impact: {type: string, enum: [none, minor, major, critical]}
              starts_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProbeClaim:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 256, description: Most checks to return; out-of-range values are clamped}
        version: {type: string, maxLength: 64, description: The probe's software version, shown to operators}
    ProbeWork:
      type: object
      required: [region, checks]
      properties:
        region: {type: string}
        checks:
          type: array
          items: {$ref: '#/components/schemas/ProbeCheck'}
    ProbeCheck:
      type: object
      required: [monitor_id, kind, follow_redirects, timeout_ms, public_only]
      properties:
        monitor_id: {type: string, format: uuid}
        kind: {type: string, enum: [http, keyword, tcp]}
        url: {type: string, description: 'The target; tcp://host:port for tcp checks'}
        method: {type: string}
        headers:
          type: object
          additionalProperties: {type: string}
        body: {type: string}
        expected_statuses:
          type: array
          items: {type: integer}
        keyword: {type: string}
        keyword_absent: {type: boolean}
        follow_redirects: {type: boolean}
        timeout_ms: {type: integer}
        public_only: {type: boolean, description: Refuse to connect to private, loopback and link-local addresses}
    ProbeResultBatch:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/ProbeReport'}
    ProbeReport:
      type: object
      additionalProperties: false
      required: [monitor_id, checked_at, up]
      properties:
        monitor_id: {type: string, format: uuid}
        checked_at: {type: string, format: date-time}
        up: {type: boolean}
        status_code: {type: integer}
        error: {type: string, maxLength: 512, description: Longer messages are truncated}
        total_ms: {type: number}
        dns_ms: {type: number}
        connect_ms: {type: number}
        tls_ms: {type: number}
        ttfb_ms: {type: number}
        cert_expires_at: {type: string, format: date-time}
    ProbeResultsResponse:
      type: object
      properties:
        accepted: {type: integer}
        received: {type: integer}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorDetail:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - invalid_json
            - forbidden_role
            - invalid_role
            - already_member
            - invite_pending
            - invalid_invite
            - invite_wrong_account
            - cannot_change_own_role
            - owner_cannot_leave
            - confirmation_mismatch
            - invalid_display_name
            - invalid_workspace_name
            - invalid_timezone
            - email_taken
            - email_unchanged
            - subscription_active
            - not_found
            - monitor_not_found
            - invalid_monitor
            - channel_not_found
            - invalid_channel
            - invalid_maintenance
            - status_page_not_found
            - invalid_status_page
            - slug_taken
            - domain_taken
            - domain_not_verified
            - probe_region_unavailable
            - cross_origin
            - unauthorized
            - invalid_api_key
            - account_suspended
            - rate_limited
            - quota_exceeded
            - plan_limit_exceeded
            - internal_error
            - service_unavailable
            - billing_resume_failed
            - billing_plan_change_failed
            - billing_checkout_pending
            - billing_checkout_completed
            - billing_complimentary_plan
        message: {type: string}
        request_id: {type: string}
