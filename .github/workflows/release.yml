name: Host verify and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PRODUCTION_BRANCH: main

jobs:
  verify:
    name: Verify Host
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
      test: ${{ steps.scope.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test image change detection
        run: python3 .github/scripts/changes_test.py

      - name: Find the last successful main run
        id: baseline
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Work out what changed
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          RELEASE_BASE: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base="${RELEASE_BASE:-}"
          else
            base="${BASE:-}"
          fi
          bash .github/scripts/changes.sh host "$base" "$GITHUB_SHA"

      - name: Validate deployment configurations
        if: steps.scope.outputs.compose == 'true'
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f compose.local.yml config --quiet
          docker compose --env-file deploy/.env -f deploy/compose.yml config --quiet
          docker compose --env-file deploy/.env -f deploy/compose.yml -f deploy/compose.smart.yml config --quiet
          APP_NETWORK=ci-network docker compose --env-file deploy/.env -f deploy/compose.yml -f deploy/compose.network.yml config --quiet
          APP_NETWORK=ci-network docker compose --env-file deploy/.env -f deploy/compose.yml -f deploy/compose.network.yml -f deploy/compose.systemd.yml config --quiet
          APP_NETWORK=ci-network docker compose --env-file deploy/.env -f deploy/compose.yml -f deploy/compose.smart.yml -f deploy/compose.network.yml -f deploy/compose.systemd.yml config --quiet

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.test == 'true'
        with:
          go-version-file: go.mod

      - run: go test -race ./internal/host/... ./internal/checks/... ./cmd/host ./cmd/webbuild
        if: steps.scope.outputs.test == 'true'
      - run: go vet ./internal/host/... ./internal/checks/... ./cmd/host ./cmd/webbuild
        if: steps.scope.outputs.test == 'true'

  verify-macos:
    name: Verify macOS
    needs: verify
    if: needs.verify.outputs.test == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/host/... ./internal/checks/... ./cmd/host ./cmd/webbuild
      - run: go vet ./internal/host/... ./internal/checks/... ./cmd/host ./cmd/webbuild
      - run: go build -trimpath -o monitor ./cmd/host

  version:
    name: Reserve a build number
    needs: [verify, verify-macos]
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.verify.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reserve a build number for this commit
        id: reserve
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          existing="$(git ls-remote --tags --refs origin "refs/tags/build/${BRANCH}/*" \
            | awk -v sha="${GITHUB_SHA}" '$1 == sha { sub(".*/", "", $2); print $2 }' | sort -n | tail -1)"

          if [ -n "$existing" ]; then
            echo "reusing build ${existing}, already tagged on this commit"
            echo "version=1.0.${existing}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            last="$(git ls-remote --tags --refs origin "refs/tags/build/${BRANCH}/*" \
              | sed 's#.*/##' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
            build="$(( ${last:-0} + 1 ))"

            if git tag "build/${BRANCH}/${build}" "${GITHUB_SHA}" \
              && git push origin "build/${BRANCH}/${build}"; then
              echo "version=1.0.${build}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git tag -d "build/${BRANCH}/${build}" || true
            sleep "$(( attempt * 3 ))"
          done

          echo "could not reserve a build number for ${BRANCH}" >&2
          exit 1

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [verify, version]
    if: >-
      !cancelled() && needs.verify.result == 'success'
      && needs.verify.outputs.build == 'true'
      && (github.event_name == 'pull_request' || needs.version.result == 'success')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [monitor]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version || 'dev' }}
            org.opencontainers.image.title=${{ matrix.image }}
          build-args: VERSION=${{ needs.version.outputs.version || 'dev' }}
          cache-from: |
            type=gha,scope=monitor-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Record the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests/${{ matrix.arch }}"
          touch "$RUNNER_TEMP/digests/${{ matrix.arch }}/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: digests-${{ matrix.arch }}-${{ matrix.image }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }} (amd64 + arm64)
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [monitor]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*-${{ matrix.image }}
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}-latest
            type=raw,value=${{ github.ref_name }}-${{ needs.version.outputs.version }}
            type=sha,format=short,prefix=${{ github.ref_name }}-
            type=raw,value=latest,enable=${{ github.ref_name == env.PRODUCTION_BRANCH }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ github.ref_name == env.PRODUCTION_BRANCH }}

      - name: Merge and verify both platforms
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          META: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do tags+=("$tag"); done < <(jq -r '.tags[]' <<< "$META")
          [ "${#tags[@]}" -gt 0 ]
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for arch in amd64 arm64; do
            digests=("$RUNNER_TEMP/digests/$arch"/*)
            [ "${#digests[@]}" -eq 1 ]
            [ -f "${digests[0]}" ]
            digest="${digests[0]##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${tags[0]}" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .os + "/" + .architecture]
            | sort == ["linux/amd64", "linux/arm64"]'
          {
            echo "### $IMAGE (amd64 + arm64)"
            printf '%s\n' "${tags[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: ${{ matrix.image }}
    needs: [verify, version, build, publish]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      matrix:
        image: [monitor]
    steps:
      - name: Check required image jobs
        env:
          BUILD_REQUIRED: ${{ needs.verify.outputs.build }}
          VERIFY: ${{ needs.verify.result }}
          VERSION: ${{ needs.version.result }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          [ "$VERIFY" = success ]
          if [ "$BUILD_REQUIRED" = true ]; then
            [ "$BUILD" = success ]
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              [ "$VERSION" = success ]
              [ "$PUBLISH" = success ]
            fi
          else
            [ "$BUILD_REQUIRED" = false ]
            [ "$VERSION" = skipped ]
            [ "$BUILD" = skipped ]
            [ "$PUBLISH" = skipped ]
            echo "No image inputs changed."
          fi
