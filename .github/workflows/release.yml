name: Verify and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PRODUCTION_BRANCH: main

jobs:
  verify:
    name: Verify monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: go test -race ./...
      - run: go vet ./...

  version:
    name: Reserve a build number
    needs: verify
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reserve a build number for this commit
        id: reserve
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          existing="$(git ls-remote --tags --refs origin "refs/tags/build/${BRANCH}/*" \
            | awk -v sha="${GITHUB_SHA}" '$1 == sha { sub(".*/", "", $2); print $2 }' | sort -n | tail -1)"

          if [ -n "$existing" ]; then
            echo "reusing build ${existing}, already tagged on this commit"
            echo "version=1.0.${existing}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            last="$(git ls-remote --tags --refs origin "refs/tags/build/${BRANCH}/*" \
              | sed 's#.*/##' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
            build="$(( ${last:-0} + 1 ))"

            if git tag "build/${BRANCH}/${build}" "${GITHUB_SHA}" \
              && git push origin "build/${BRANCH}/${build}"; then
              echo "version=1.0.${build}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git tag -d "build/${BRANCH}/${build}" || true
            sleep "$(( attempt * 3 ))"
          done

          echo "could not reserve a build number for ${BRANCH}" >&2
          exit 1

  image:
    name: ${{ matrix.image }}
    needs: [verify, version]
    if: >-
      !cancelled() && needs.verify.result == 'success'
      && (github.event_name == 'pull_request' || needs.version.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: monitor
            target: ""
          - image: monitor-smart
            target: smart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}-latest
            type=raw,value=${{ github.ref_name }}-${{ needs.version.outputs.version }}
            type=sha,format=short,prefix=${{ github.ref_name }}-
            type=raw,value=latest,enable=${{ github.ref_name == env.PRODUCTION_BRANCH }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ github.ref_name == env.PRODUCTION_BRANCH }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ needs.version.outputs.version || 'dev' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
