name: Cloud build, publish and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  PRODUCTION_BRANCH: main

jobs:
  scope:
    name: Detect Cloud changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
      test: ${{ steps.scope.outputs.test }}
      compose: ${{ steps.scope.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test image change detection
        run: python3 .github/scripts/changes_test.py

      - name: Find the last successful main run
        id: baseline
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloud.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Work out what changed
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          RELEASE_BASE: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base="${RELEASE_BASE:-}"
          else
            base="${BASE:-}"
          fi
          bash .github/scripts/changes.sh cloud "$base" "$GITHUB_SHA"

  test:
    name: Test Cloud
    needs: scope
    if: needs.scope.outputs.test == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor_ci
          POSTGRES_DB: monitor_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ADMIN_URL: postgres://monitor:monitor_ci@localhost:5432/monitor_core?sslmode=disable
      TEST_DATABASE_URL: postgres://monitor:monitor_ci@localhost:5432/monitor_core?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://monitor_app:monitor_app_ci@localhost:5432/monitor_core?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate deployment configurations
        if: needs.scope.outputs.compose == 'true'
        run: |
          cp cloud/.env.example cloud/.env
          docker compose --env-file cloud/.env -f cloud/compose.yml --profile control config --quiet
          docker compose --env-file cloud/.env -f cloud/compose.prod.yml --profile control config --quiet

      - name: Provision the database
        run: |
          set -euo pipefail
          psql "${ADMIN_URL}" -v ON_ERROR_STOP=1 -v app_password=monitor_app_ci -f cloud/db/provision/app_role.sql
          DATABASE_URL="${ADMIN_URL}" go run ./cmd/cloud migrate up

      - name: Test the API
        run: |
          go vet ./cloud/db/... ./internal/cloud/... ./internal/checks/... ./cmd/cloud*
          go test -race -count=1 ./cloud/db/... ./internal/cloud/... ./internal/checks/... ./cmd/cloud*

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloud/dashboard/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloud/dashboard/pnpm-lock.yaml

      - name: Check the dashboard
        working-directory: cloud/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  build-publish:
    name: Build and publish
    needs: [scope, test]
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-26.04

    outputs:
      image_tag: ${{ steps.publish.outputs.image_tag }}
      app_digest: ${{ steps.publish.outputs.app_digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine next branch build number
        id: version
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          last="$(git ls-remote --tags --refs origin "refs/tags/cloud-build/${BRANCH}/*" \
            | sed 's#.*/##' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
          build="$(( ${last:-0} + 1 ))"

          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "version=1.0.${build}" >> "${GITHUB_OUTPUT}"

      - name: Compose the shared image labels
        id: labels
        env:
          VERSION: ${{ steps.version.outputs.version || 'prod' }}
        run: |
          set -euo pipefail

          printf 'args=%s %s %s\n' \
            "--label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            "--label org.opencontainers.image.revision=${GITHUB_SHA}" \
            "--label org.opencontainers.image.version=${VERSION}" \
            >> "${GITHUB_OUTPUT}"

      - name: Build production image
        run: |
          docker build -f cloud/Dockerfile \
            --build-arg VERSION="${{ steps.version.outputs.version || 'prod' }}" \
            --build-arg GIT_COMMIT="${GITHUB_SHA:0:7}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            ${{ steps.labels.outputs.args }} \
            -t ghcr.io/thekiharani/monitor-cloud:ci .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the Cloud image
        id: publish
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          branch_tag="$(printf '%s' "${BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9_.-]+#-#g; s/^-+//; s/-+$//')"
          short_sha="${GITHUB_SHA:0:7}"

          [ -n "${branch_tag}" ] || {
            echo "branch name produced an empty Docker tag" >&2
            exit 1
          }

          repository="${REGISTRY}/thekiharani/monitor-cloud"
          tags=(
            "${repository}:${branch_tag}-latest"
            "${repository}:${branch_tag}-${VERSION}"
            "${repository}:${branch_tag}-${short_sha}"
          )
          if [ "${BRANCH}" = "${PRODUCTION_BRANCH}" ]; then
            tags+=("${repository}:latest" "${repository}:${VERSION}")
          fi
          for tag in "${tags[@]}"; do
            docker tag "${repository}:ci" "${tag}"
            docker push "${tag}"
          done
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${repository}:ci")"
          digest="${digest##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_tag=${branch_tag}-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "app_digest=${digest}" >> "${GITHUB_OUTPUT}"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "cloud-build/${BRANCH}/${BUILD_NUMBER}" "${GITHUB_SHA}"
          git push origin "cloud-build/${BRANCH}/${BUILD_NUMBER}"

  deploy:
    name: Deploy to the VPS
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: build-publish
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload the production Compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          source: cloud/compose.prod.yml
          strip_components: 1
          target: ~/docker/monitor-cloud
          overwrite: true

      - name: Roll the stack
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ~/docker/monitor-cloud

            export MONITOR_IMAGE_TAG='${{ needs.build-publish.outputs.image_tag }}'
            app_digest='${{ needs.build-publish.outputs.app_digest }}'

            docker compose -f compose.prod.yml config --quiet

            [ ! -f compose.yml ] || cp -p compose.yml compose.previous.yml
            if [ -f compose.yml ] && [ -f .image_tag ]; then
              previous_tag="$(cat .image_tag)"
            else
              previous_tag=""
            fi
            mv -f compose.prod.yml compose.yml

            docker compose pull app

            verify_digest() {
              image="$1"
              expected="$2"
              [ -n "$expected" ] || { echo "no expected digest for $image" >&2; return 1; }
              actual="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" \
                | grep -o 'sha256:[0-9a-f]*' | head -1)"
              if [ "$actual" != "$expected" ]; then
                echo ">> $image is $actual, expected $expected" >&2
                return 1
              fi
              echo ">> $image matches $expected"
            }

            verify_digest "ghcr.io/thekiharani/monitor-cloud:${MONITOR_IMAGE_TAG}" "$app_digest"

            docker compose run --rm -T --no-deps --pull never migrate

            diagnose() {
              cid="$1"
              docker inspect -f 'state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} error={{json .State.Error}}' "$cid" || true
              docker inspect -f '{{range .State.Health.Log}}{{println .Start "exit=" .ExitCode .Output}}{{end}}' "$cid" || true
              docker logs --tail 80 "$cid" || true
            }

            verdict_template='{{if and .State.Health (eq .State.Health.Status "healthy")}}healthy{{else if or .State.OOMKilled (gt .RestartCount 0)}}failed{{else if or (eq .State.Status "exited") (eq .State.Status "dead") (eq .State.Status "restarting")}}failed{{else}}pending{{end}}'

            wait_healthy() {
              service="$1"
              timeout="${2:-120}"
              cid="$(docker compose ps -q --all "$service")"
              [ -n "$cid" ] || { echo "no container for $service" >&2; return 1; }
              deadline=$((SECONDS + timeout))
              while [ "$SECONDS" -lt "$deadline" ]; do
                verdict="$(docker inspect -f "$verdict_template" "$cid" 2>/dev/null || echo failed)"
                case "$verdict" in
                  healthy)
                    echo ">> $service healthy"
                    return 0
                    ;;
                  failed)
                    echo ">> $service failed during startup"
                    diagnose "$cid"
                    return 1
                    ;;
                esac
                sleep 2
              done
              echo ">> $service health timeout after ${timeout}s" >&2
              diagnose "$cid"
              return 1
            }

            rollback() {
              echo ">> rolling back to ${previous_tag:-the previous compose file}" >&2
              if [ -f compose.previous.yml ]; then
                mv -f compose.previous.yml compose.yml
              fi
              if [ -n "$previous_tag" ]; then
                export MONITOR_IMAGE_TAG="$previous_tag"
              fi
              docker compose up -d --no-deps --force-recreate app || true
              echo ">> rollback attempted; the stack is on ${MONITOR_IMAGE_TAG}" >&2
              exit 1
            }

            trap rollback ERR

            echo ">> rolling app"
            docker compose up -d --no-deps --force-recreate --pull never app
            wait_healthy app 120

            trap - ERR
            printf '%s' "${MONITOR_IMAGE_TAG}" > .image_tag

            echo ">> removing retired application services"
            docker compose up -d --no-deps --pull never --remove-orphans app

            docker image prune -f --filter 'label=org.opencontainers.image.source=https://github.com/${{ github.repository }}'
            docker builder prune -f --keep-storage 2GB || true
