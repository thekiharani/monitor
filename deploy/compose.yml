name: monitor

services:
  monitor:
    image: ${MONITOR_IMAGE:-ghcr.io/thekiharani/monitor:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER_HOST: ${MONITOR_DOCKER_HOST-http://docker-proxy:2375}
      HOST_PROC: ${HOST_PROC:-/host/proc}
      HOST_SYS: ${HOST_SYS:-/host/sys}
      HOST_ROOT: ${HOST_ROOT:-/host/root}
      SMART_FILE: ${SMART_FILE:-/shared/smart.json}
    ports:
      - "${MONITOR_BIND:-127.0.0.1}:${MONITOR_PORT:-9100}:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${HOST_PROC_PATH:-/proc}:${HOST_PROC:-/host/proc}:ro
      - ${HOST_SYS_PATH:-/sys}:${HOST_SYS:-/host/sys}:ro
      - ${HOST_ROOT_PATH:-/}:${HOST_ROOT:-/host/root}:ro
      - ${MONITOR_DATA_PATH:-data}:/data
      - ${MONITOR_SMART_PATH:-smart}:/shared:ro
    networks:
      - default
      - proxy
    depends_on:
      - docker-proxy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  docker-proxy:
    image: ${MONITOR_IMAGE:-ghcr.io/thekiharani/monitor:${IMAGE_TAG:-latest}}
    command: ["docker-proxy"]
    restart: unless-stopped
    user: ${DOCKER_PROXY_USER:-0:0}
    environment:
      DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:${DOCKER_SOCKET:-/var/run/docker.sock}:ro
    networks:
      - proxy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  smart:
    image: ${MONITOR_SMART_IMAGE:-ghcr.io/thekiharani/monitor-smart:${IMAGE_TAG:-latest}}
    profiles: [smart]
    restart: unless-stopped
    environment:
      SMART_FILE: ${SMART_FILE:-/shared/smart.json}
      SMART_INTERVAL: ${SMART_INTERVAL:-15m}
    volumes:
      - ${HOST_DEV_PATH:-/dev}:/dev:ro
      - ${MONITOR_SMART_PATH:-smart}:/shared
    # NVMe drives also need SYS_ADMIN for smartctl to read their health log
    cap_drop: [ALL]
    cap_add: [SYS_RAWIO]
    device_cgroup_rules:
      - "b 8:* r"
      - "b 259:* r"
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  proxy:
    internal: true

volumes:
  data:
  smart:
