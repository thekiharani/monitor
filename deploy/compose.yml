name: monitor

services:
  monitor:
    image: ${MONITOR_IMAGE:-ghcr.io/thekiharani/monitor:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER_HOST: ${MONITOR_DOCKER_HOST-http://docker-proxy:2375}
      HOST_PROC: ${HOST_PROC:-/host/proc}
      HOST_SYS: ${HOST_SYS:-/host/sys}
      HOST_ROOT: ${HOST_ROOT:-/host/root}
      MONITOR_SMART_ENABLED: ${MONITOR_SMART_ENABLED:-false}
      MONITOR_SMART_INTERVAL: ${MONITOR_SMART_INTERVAL:-15m}
    ports:
      - "${MONITOR_BIND:-127.0.0.1}:${MONITOR_PORT:-9100}:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${HOST_PROC_PATH:-/proc}:${HOST_PROC:-/host/proc}:ro
      - ${HOST_SYS_PATH:-/sys}:${HOST_SYS:-/host/sys}:ro
      - ${HOST_ROOT_PATH:-/}:${HOST_ROOT:-/host/root}:ro
      - ${MONITOR_DATA_PATH:-data}:/data
    networks:
      - default
      - proxy
    depends_on:
      - docker-proxy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  docker-proxy:
    image: ${MONITOR_IMAGE:-ghcr.io/thekiharani/monitor:${IMAGE_TAG:-latest}}
    command: ["docker-proxy"]
    restart: unless-stopped
    user: ${DOCKER_PROXY_USER:-0:0}
    environment:
      DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
      CONTAINER_LOGS: ${MONITOR_CONTAINER_LOGS:-true}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:${DOCKER_SOCKET:-/var/run/docker.sock}:ro
    networks:
      - proxy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  proxy:
    internal: true

volumes:
  data:
